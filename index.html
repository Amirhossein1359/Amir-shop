<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فروشگاه Amir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Vazirmatn', sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #fff;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #00d1b2;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background-color: #1f1f1f;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .product:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transform: translateY(-5px);
    }

    .product img {
      border-radius: 15px;
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .product h2 {
      font-size: 1.2rem;
      margin: 10px 0 5px;
    }

    .product p {
      color: #aaa;
      font-size: 0.9rem;
    }

    .product button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #00d1b2;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #cart-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      font-size: 1.2rem;
      color: #00d1b2;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>فروشگاه Amir</h1>
    <p>با طراحی مدرن و مشکی مانند دیجی‌کالا</p>
  </header>

  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300x150.png?text=کالای+اول" alt="کالا ۱">
      <h2>کالای اول</h2>
      <p>قیمت: 100000 تومان</p>
      <button onclick="addToCart('کالای اول', 100000)">افزودن به سبد</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x150.png?text=کالای+دوم" alt="کالا ۲">
      <h2>کالای دوم</h2>
      <p>قیمت: 200000 تومان</p>
      <button onclick="addToCart('کالای دوم', 200000)">افزودن به سبد</button>
    </div>
  </div>

  <a id="cart-link" href="cart.html">مشاهده سبد خرید</a>

  <script>
    function addToCart(name, price) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(name + ' به سبد خرید اضافه شد!');
    }
  </script>
</body>
</html>
