<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir - فروشگاه آنلاین</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
        }

        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            color: #fff;
        }

        .product-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            padding: 20px;
        }

        .product {
            background-color: #222;
            border-radius: 10px;
            width: 200px;
            margin: 10px;
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .product h3 {
            color: #00d1b2;
            font-size: 1.5rem;
        }

        .product p {
            color: #ccc;
            font-size: 1.2rem;
        }

        .add-to-cart {
            background-color: #ff5c5c;
            color: #fff;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-to-cart:hover {
            background-color: #ff4040;
        }

        .cart-icon {
            font-size: 2rem;
            color: #ff5c5c;
            cursor: pointer;
        }

        .cart-icon:hover {
            color: #ff4040;
        }

        #support {
            text-align: center;
            margin-top: 50px;
            color: #fff;
        }

        #support h2 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d1b2;
        }

        #support p {
            font-size: 1.2rem;
        }

        #support .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff5c5c;
        }

        #support .name {
            font-size: 1.1rem;
            color: #ccc;
        }
    </style>
</head>
<body>

<header>
    <h1>Amir - فروشگاه آنلاین</h1>
</header>

<div class="product-list">
    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product 1">
        <h3>محصول 1</h3>
        <p>قیمت: 500,000 تومان</p>
        <button class="add-to-cart">افزودن به سبد خرید</button>
    </div>
    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product 2">
        <h3>محصول 2</h3>
        <p>قیمت: 700,000 تومان</p>
        <button class="add-to-cart">افزودن به سبد خرید</button>
    </div>
    <!-- محصولات بیشتر اضافه کن -->
</div>

<div id="support">
    <h2>پشتیبانی</h2>
    <p>تماس با شماره: <span class="number">09361231433</span></p>
    <p class="name">به اسم امیرحسین</p>
</div>

</body>
</html>
