<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه آنلاین امیر</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- هدر سایت -->
    <header>
        <div class="logo">
            <h1>فروشگاه آنلاین امیر</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">خانه</a></li>
                <li><a href="#">دسته بندی‌ها</a></li>
                <li><a href="#">تماس با ما</a></li>
                <li><a href="#">سبد خرید</a></li>
            </ul>
        </nav>
    </header>

    <!-- بخش محصولات -->
    <main>
        <h2>محصولات پرفروش</h2>
        <section class="products">
            <div class="product">
                <img src="images/product1.jpg" alt="محصول 1">
                <h3>گوشی موبایل سامسونگ</h3>
                <p class="price">3,500,000 تومان</p>
                <button class="add-to-cart">افزودن به سبد خرید</button>
            </div>
            <div class="product">
                <img src="images/product2.jpg" alt="محصول 2">
                <h3>هدفون بی‌سیم</h3>
                <p class="price">1,200,000 تومان</p>
                <button class="add-to-cart">افزودن به سبد خرید</button>
            </div>
            <div class="product">
                <img src="images/product3.jpg" alt="محصول 3">
                <h3>لپ‌تاپ دل</h3>
                <p class="price">7,000,000 تومان</p>
                <button class="add-to-cart">افزودن به سبد خرید</button>
            </div>
        </section>
    </main>

    <!-- فوتر سایت -->
    <footer>
        <p>تمامی حقوق محفوظ است &copy; 2025 فروشگاه آنلاین امیر</p>
        <p>پشتیبانی: 09361231433</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
