<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سبد خرید</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #121212;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00d1b2;
    }

    .cart-item {
      background: #1f1f1f;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-item button {
      background: #ff5c5c;
      color: white;
      border: none;
      padding: 5px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    #total {
      text-align: center;
      font-size: 1.3rem;
      margin-top: 20px;
    }

    a {
      color: #00d1b2;
      display: block;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>سبد خرید</h1>
  <div id="cart-items"></div>
  <div id="total"></div>
  <a href="index.html">بازگشت به فروشگاه</a>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const container = document.getElementById('cart-items');
    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <span>${item.name} - ${item.price.toLocaleString()} تومان</span>
        <button onclick="removeItem(${index})">حذف</button>
      `;
      container.appendChild(div);
    });

    document.getElementById('total').innerText = 'مجموع: ' + total.toLocaleString() + ' تومان';

    function removeItem(i) {
      cart.splice(i, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      location.reload();
    }
  </script>

</body>
</html>
